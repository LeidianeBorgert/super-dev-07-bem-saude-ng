<div class="space-y-6">

    <div class="flex justify-between">
        <div>
            <h1 class="text-2xl font-bold text-gray-900">Consultas</h1>
            <p class="text-gray-600">Gerenciamento de agendamentos</p>
        </div>

        <p-button label="Nova Consulta" icon="fa fa-plus" (onClick)="showDialog()"></p-button>
    </div>

    <div class="bg-white rounded-xl shadow-sm p-4">
        <div class="flex flex-row gap-4">
            <p-date-picker fluid id="data" [(ngModel)]="data" icon="pi-calendar-minus" />
            <p-select [options]="filtroProfissional" [(ngModel)]="filtroProfissionalSelecionado"></p-select>

            <p-select [options]="filtroStatus" [(ngModel)]="filtroStatusSelecionado"></p-select>
        </div>
    </div>

    <p-table [value]="consultas" [tableStyle]="{ 'min-width': '50rem' }" [paginator]="true" [rows]="5"
        [rowsPerPageOptions]="[5, 10, 20]">
        <ng-template #header>
            <tr>
                <th>Horário</th>
                <th>Paciente</th>
                <th>Profissional</th>
                <th>Status</th>
                <th>
                    <div class="text-right">Ações</div>
                </th>
            </tr>
        </ng-template>
        <ng-template #body let-consulta>
            <tr>
                <td>
                    <div class="flex flex-row grid gap-1">
                        <span>{{consulta.horarioPrevisto}}</span>
                        <span>{{consulta.data}}</span>
                    </div>
                </td>
                <td>{{ consulta.paciente }}</td>
                <td>{{ consulta.profissional }}</td>
                <td>
                    <app-consulta-status-tag [statusConsulta]="consulta.status" />
                </td>
                <td>
                    <div class="flex gap-1 justify-end">
                        <p-button icon="fa-regular fa-pen-to-square" variant="text" severity="info" />
                        <p-button icon="fa fa-trash" variant="text" severity="danger" />
                    </div>
                </td>
            </tr>
        </ng-template>
    </p-table>
</div>
<p-dialog header="Cadastro de Paciente" [modal]="true" [(visible)]="visible" [style]="{ width: '50rem' }">
    <form [formGroup]="consultaForm">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-3">

            <div class="md:col-span-2">
                <label for="paciente" class="font-semibold w-24">Paciente <span
                        class="font-bold text-red-700">*</span></label>
                <p-select [options]="filtroStatus" formControlName="paciente" fluid></p-select>

            </div>
            <div class="md:col-span-2">
                <label for="paciente" class="font-semibold w-24">Profissional <span
                        class="font-bold text-red-700">*</span></label>
                <p-select [options]="filtroStatus" formControlName="profissional" fluid></p-select>
            </div>
            <div>
                <label for="data" class="font-semibold w-24" icon="pi-calendar-minus">Data <span class="font-bold text-red-700">*</span></label>
                <p-date-picker fluid id="data" formControlName="data" />
            </div>
            <div>
                <label for="horarioPrevisto" class="font-semibold w-24" icon="pi-clock">Horário <span
                        class="font-bold text-red-700">*</span></label>  
                <p-inputMask mask="99:99" placeholder="HH:MM" [(ngModel)]="horario" fluid>
                </p-inputMask>
            </div>


            <div class="md:col-span-2">
                <label for="observacao" class="font-semibold w-24">Observação</label>
                <textarea rows="5" cols="30" pTextarea fluid formControlName="observacoes" id="observacoes"></textarea>
            </div>



            <div class="flex justify-end gap-2">
                <p-button label="Cancelar" severity="secondary" (click)="cancelar()" />
                <p-button label="Salvar" icon="fa fa-save" (click)="salvar()" [disabled]="consultaForm.invalid" />
            </div>
        </div>

    </form>
</p-dialog>
